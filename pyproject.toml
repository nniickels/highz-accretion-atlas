[project]
name = "highz-accretion-atlas"
version = "4.0.1"
description = "A provenance-aware catalogue and growth-pressure atlas for high-redshift accreting black holes."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "pandas==2.2.3",
  "matplotlib==3.11.1",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab==4.4.6",
  "nbconvert==7.16.6",
]

[tool.setuptools]
packages = ["src", "scripts"]
