name: reproducibility

on:
  push:
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/core.txt
            requirements/notebook.txt
            pyproject.toml
      - name: Install pinned dependencies
        run: |
          python -m pip install --requirement requirements/notebook.txt
          python -m pip check
      - name: Build and import the Python package
        env:
          SOURCE_DATE_EPOCH: "1788393600"
        run: |
          mkdir -p "$RUNNER_TEMP/wheel"
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          python -c "import src.datasets, src.science, src.internal.compatibility.v7_catalogue"
      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
      - name: Verify publication PNG and PDF exports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.internal.publication_figures --verify
      - name: Verify source provenance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.internal.verify_source_provenance
      - name: Audit redshift source values and report unresolved identities
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.internal.verify_redshift_identity
      - name: Verify v1/v2/v3 dataset and result contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m src.internal.verify_versions
      - name: Execute the complete public notebook workflow
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HIGHZ_BASELINE_ROOT: ${{ github.workspace }}
        run: |
          notebook_workspace="$RUNNER_TEMP/highz-atlas-notebook-workspace"
          executed_notebooks="$RUNNER_TEMP/highz-atlas-executed-notebooks"
          mkdir -p "$notebook_workspace" "$executed_notebooks"
          git archive HEAD | tar -x -C "$notebook_workspace"
          cd "$notebook_workspace"
          # Regenerate from inputs in this disposable archive, not inherited outputs.
          python - <<'PY'
          from pathlib import Path
          from src.internal.verify_regenerated_artifacts import artifact_paths
          root = Path.cwd()
          for name in artifact_paths(root):
              (root / name).unlink()
          PY
          for notebook in scripts/0[0-4]_*.ipynb; do
            python -m nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1800 \
              --output-dir="$executed_notebooks" "$notebook"
          done
      - name: Measure failed image comparisons
        if: failure()
        run: |
          python -m src.internal.report_image_differences "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/highz-atlas-notebook-workspace"
