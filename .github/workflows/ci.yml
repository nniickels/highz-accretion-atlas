name: reproducibility

on:
  push:
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-lock.txt
      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests
      - name: Verify frozen v4 release from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v4_release --reproduce --require-clean
      - name: Verify frozen v5 release from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v5_release --reproduce --require-clean
      - name: Verify current v6 release from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v6_release --reproduce --require-clean
      - name: Verify current v7 catalogue from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v7_catalogue --reproduce --require-clean
      - name: Verify current v7.1 catalogue from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v7_1_catalogue --reproduce --require-clean
      - name: Verify current v7.2 catalogue from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v7_2_catalogue --reproduce --require-clean
      - name: Verify v7.2 class-aware science from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v7_2_science --reproduce --require-clean
      - name: Verify current v7.3 catalogue from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v7_3_catalogue --reproduce --require-clean
      - name: Verify canonical v5 paper figures from a clean worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_v5_figures --require-clean
